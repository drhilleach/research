<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading the study…</title>
<style>
 body{font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;
      display:flex;align-items:center;justify-content:center;background:#faf9f5;color:#141413;
      padding:24px;text-align:center}
 .box{max-width:460px} h1{font-size:19px;font-weight:600;margin:0 0 10px}
 p{color:#555;font-size:14.5px} .err{color:#a03050}
 code{background:#eeece5;padding:2px 5px;border-radius:3px;font-size:13px}
</style></head><body>
<div class="box" id="m"><h1>Loading the study…</h1><p>One moment.</p></div>

<script>
// ---------------------------------------------------------------------------
// SVM trial44 allocation page (built from go.html / go2.html, 1 Oct 2026).
// ONE Prolific study points here; this forwards to one of two Google Forms:
//   V1 = order 1,2,3,...   V2 = runs swapped 2,1,3,5,4,6,...
//
// Prolific study URL:
//     https://YOURSITE/trial44.html?PROLIFIC_PID={{%PROLIFIC_PID%}}
//
// Allocation is a pure function of the Prolific ID, as in go.html, with one
// change: the ID is SALTED with "trial44:" before hashing, so the trial44 arm is
// independent of the PRIMED/CONTROL arm go.html gave the same ID.
//   arm = top bit of fnv1a("trial44:" + PID)   ->  1 = V2, 0 = V1
// (NOT the low bit: in FNV-1a the low bit is only the parity of the character
// codes, so a salt cannot change it and it would copy go.html's arm exactly.)
// Re-derive in Python with the same FNV-1a 32-bit (see trial44_alloc_check.py).
//
// Testing only: add &v=1 or &v=2 to force a version (Prolific never adds it).
// ---------------------------------------------------------------------------

var SALT = 'trial44:';
var FORM = {
  V1: "https://docs.google.com/forms/d/e/1FAIpQLSerKQg-HnpuncB0ifYAvuWs3DvUGf0RIdct8bULEWkmPWS6KA/viewform?usp=pp_url&entry.501456709=__PID__",
  V2: "https://docs.google.com/forms/d/e/1FAIpQLSc4JWBPY7eNGtxOCZ6NFeshbpv_aWD4qcGtIK2vNb27DfUfCg/viewform?usp=pp_url&entry.2063661132=__PID__"
};

function fnv1a(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;   // imul, not *, and force uint32
  }
  return h >>> 0;
}

function show(html, isErr){
  document.getElementById('m').innerHTML = html;
  if (isErr) document.getElementById('m').className = 'box err';
}

(function(){
  var q = new URLSearchParams(window.location.search);
  var pid = (q.get('PROLIFIC_PID') || q.get('prolific_pid') || '').trim();

  if (!pid){
    show('<h1>Could not read your Prolific ID</h1>' +
         '<p>Please return to Prolific and open the study from there rather than ' +
         'from a saved link. If this keeps happening, return the submission and ' +
         'message the researcher.</p>', true);
    return;
  }

  var force = q.get('v');
  var arm = force === '1' ? 'V1' : force === '2' ? 'V2'
          : ((fnv1a(SALT + pid) >>> 31) ? 'V2' : 'V1');
  window.location.replace(FORM[arm].replace('__PID__', encodeURIComponent(pid)));
})();
</script>
</body></html>
